<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rhomad Khaoula - AI and Data Science Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#36BCF7" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="round"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <circle cx="150" cy="90" r="130" fill="#36BCF7" opacity="0.28" filter="url(#soft)">
      <animate attributeName="cx" values="150;300;150" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="230" r="140" fill="#A855F7" opacity="0.30" filter="url(#soft)">
      <animate attributeName="cx" values="850;700;850" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="320" r="100" fill="#F472B6" opacity="0.18" filter="url(#soft)">
      <animate attributeName="cy" values="320;260;320" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g fill="#36BCF7">
      <circle cx="70" r="2"><animate attributeName="cy" values="330;-10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="190" r="1.6" fill="#A855F7"><animate attributeName="cy" values="330;-10" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="310" r="2.2"><animate attributeName="cy" values="330;-10" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="430" r="1.8" fill="#F472B6"><animate attributeName="cy" values="330;-10" dur="11s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="560" r="2"><animate attributeName="cy" values="330;-10" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="690" r="1.6" fill="#A855F7"><animate attributeName="cy" values="330;-10" dur="13s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13s" begin="5s" repeatCount="indefinite"/></circle>
      <circle cx="800" r="2.2" fill="#F472B6"><animate attributeName="cy" values="330;-10" dur="9s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="6s" repeatCount="indefinite"/></circle>
      <circle cx="920" r="2"><animate attributeName="cy" values="330;-10" dur="10s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="5" fill="url(#neon)" filter="url(#glow)">RHOMAD KHAOULA</text>

    <text x="500" y="196" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" letter-spacing="7" fill="#9fb3c8">AI &amp; DATA SCIENCE ENGINEER</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#cfe9ff">
      <rect x="234" y="222" width="70" height="30" rx="15" fill="#36BCF7" fill-opacity="0.12" stroke="#36BCF7" stroke-opacity="0.7"/>
      <text x="269" y="242">LLM</text>
      <rect x="318" y="222" width="70" height="30" rx="15" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.7"/>
      <text x="353" y="242">RAG</text>
      <rect x="402" y="222" width="170" height="30" rx="15" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.7"/>
      <text x="487" y="242">COMPUTER VISION</text>
      <rect x="586" y="222" width="180" height="30" rx="15" fill="#36BCF7" fill-opacity="0.12" stroke="#36BCF7" stroke-opacity="0.7"/>
      <text x="676" y="242">DATA ENGINEERING</text>
    </g>

    <rect x="290" y="268" width="420" height="34" rx="17" fill="#0b2a1a" fill-opacity="0.85" stroke="#2ea44f"/>
    <circle cx="316" cy="285" r="5" fill="#3fb950">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="512" y="290" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#7ee787">OPEN TO WORK  ·  PFE 6 MOIS  ·  FÉVRIER 2027</text>

    <rect x="0" y="316" width="1000" height="4" fill="url(#neon)"/>
  </g>
  <rect x="1" y="1" width="998" height="318" rx="21" fill="none" stroke="#36BCF7" stroke-opacity="0.25"/>
</svg>
